group 'br.com.jylabtech.elgin_payment_tech'
version '1.0'

buildscript {
    ext {
        kotlin_version = '1.9.0'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'br.com.jylabtech.elgin_payment_tech'
    }
    compileSdkVersion 36
    buildToolsVersion '28.0.3'

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'
    }

    testOptions {
        // Testes JVM: métodos do android.jar retornam valores padrão em vez de lançar exceção.
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
    }
}

dependencies{
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'

    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }

    implementation 'com.google.zxing:core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    implementation 'me.dm7.barcodescanner:zxing:1.9.8'

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'

    // Testes JVM (./gradlew :elgin_payment_tech:testDebugUnitTest)
    testImplementation 'junit:junit:4.13.2'
}
