name: elgin_payment_tech
description: Plugin Flutter para integrar sua aplicação com o SDK Android da Elgin para meios de pagamento.
version: 1.1.0
repository: https://github.com/JY-Labtech/elgin_tef_payment_tech

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  check_licence_tech: ^0.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.elgin_payment_tech
        pluginClass: ElginPaymentTechPlugin
