name: elgin_payment_tech
description: Flutter plugin for Elgin TEF payments on Android via the Elgin IDH (E1 Digital Hub) app - credit, installments, debit, PIX, refund, reprint, report and pinpad setup.
version: 3.0.0
homepage: https://github.com/JY-Labtech/elgin_tef_payment_tech
repository: https://github.com/JY-Labtech/elgin_tef_payment_tech
issue_tracker: https://github.com/JY-Labtech/elgin_tef_payment_tech/issues
topics:
  - payment
  - pos
  - tef
  - android
  - brazil

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.elgin_payment_tech
        pluginClass: ElginPaymentTechPlugin
